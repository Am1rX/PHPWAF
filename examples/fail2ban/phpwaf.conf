# /etc/fail2ban/filter.d/phpwaf.conf
#
# Matches the WAF's text log lines, e.g.:
#   2026-06-16 12:00:00 | WAF BLOCK | IP: 1.2.3.4 | Score: 40 | Rules: XSS-001 | URI: /
#
# fail2ban then bans the IP at the firewall (iptables/nftables) — instant,
# reload-free, and the traffic never touches nginx or PHP again.

[Definition]
failregex = ^.*WAF (BLOCK|HONEYPOT) \| IP: <HOST> \|.*$
ignoreregex =
