; ===========================================================================
; Site-wide activation via php.ini  (VPS / dedicated — you control PHP)
; ---------------------------------------------------------------------------
; Add this line to your php.ini (or a file in conf.d), use the ABSOLUTE path
; to guard.php, then restart PHP-FPM / the web server.
;
;   sudo systemctl restart php8.3-fpm   # adjust version
; ===========================================================================

auto_prepend_file = "/var/www/yoursite/waf/guard.php"
expose_php = Off
display_errors = Off
display_startup_errors = Off
log_errors = On
