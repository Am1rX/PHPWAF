<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; base-uri 'none'; form-action 'none'">
  <title>PHPWAF installation key</title>
  <style>
    :root { color-scheme: dark; font: 15px/1.6 "Segoe UI", sans-serif; background: #191c20; color: #e1e5ea; }
    main { max-width: 650px; margin: 56px auto; padding: 18px; border: 1px solid #393f46; background: #22262b; }
    h1 { margin: 0 0 8px; font-size: 21px; }
    p { margin: 0 0 12px; }
    output { display: block; padding: 9px; background: #16191d; font: 14px Consolas, monospace; overflow-wrap: anywhere; user-select: all; }
    button { margin-top: 12px; padding: 5px 9px; color: #fff; background: #2d6091; border: 1px solid #547fab; border-radius: 3px; font: inherit; }
  </style>
</head>
<body>
  <main>
    <h1>PHPWAF installation key</h1>
    <p>Copy this key into the private <code>phpwaf-setup.key</code> file on your hosting account.</p>
    <output id="key" aria-live="polite"></output>
    <button id="generate" type="button">Generate a new key</button>
  </main>
  <script>
    const output = document.getElementById('key');
    function generate() {
      const bytes = crypto.getRandomValues(new Uint8Array(24));
      output.textContent = Array.from(bytes, value => value.toString(16).padStart(2, '0')).join('');
    }
    document.getElementById('generate').addEventListener('click', generate);
    generate();
  </script>
</body>
</html>
