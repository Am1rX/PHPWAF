# ---------------------------------------------------------------------------
# Edge blocking with nginx.
#
# When 'edge.enabled' is true, the WAF appends blocked IPs to
# waf_storage/denylist.conf as lines like:   1.2.3.4 1;
#
# nginx reads that file via the `geo` directive and returns 403 BEFORE the
# request ever reaches PHP-FPM. This is what stops a blocked attacker from
# tying up your PHP workers.
# ---------------------------------------------------------------------------

# Optional, in http { }: create the include file before enabling this block.
# geo $waf_blocked {
#     default 0;
#     include /var/www/yoursite/waf/waf_storage/denylist.conf;
# }

server {
    listen 80;
    server_name example.com;
    root /var/www/yoursite/public;
    index index.php index.html;
    server_tokens off;
    # To omit nginx's product header as well, use a final proxy that removes
    # Server (see Caddyfile), or more_clear_headers Server with headers-more.

    # Enable with the optional geo block above.
    # if ($waf_blocked) {
    #     return 403;
    # }

    location / {
        try_files $uri $uri/ /index.php$is_args$args;
    }

    location ~ \.php$ {
        try_files $uri =404;
        include fastcgi_params;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_hide_header X-Powered-By;
        fastcgi_hide_header X-PHP;
        fastcgi_hide_header X-PHP-Version;
        fastcgi_hide_header X-AspNet-Version;
        fastcgi_hide_header X-AspNetMvc-Version;
        fastcgi_hide_header X-WAF-Version;
        fastcgi_hide_header X-Version;
        fastcgi_hide_header X-Runtime;
        fastcgi_hide_header X-Runtime-Version;
        fastcgi_hide_header X-Application-Version;
        fastcgi_hide_header X-Framework-Version;
        fastcgi_hide_header X-Server-Version;
        fastcgi_hide_header X-Backend-Version;
        fastcgi_hide_header X-Generator;
        fastcgi_hide_header X-Debug-Token;
        fastcgi_hide_header X-Debug-Token-Link;
        fastcgi_hide_header X-Profiler;
        fastcgi_hide_header X-Backend-Server;
        fastcgi_hide_header X-Served-By;
    }

    # The WAF belongs outside the web root. Also deny this URL if present.
    location ^~ /waf/ { return 404; }
}

# After the WAF writes new entries, nginx needs a reload to pick them up.
# A cron entry every minute keeps it fresh without reloading on every block:
#   * * * * * /usr/sbin/nginx -t && /usr/sbin/nginx -s reload
#
# For instant, reload-free blocking, prefer the fail2ban approach (see
# examples/fail2ban/) which bans at the iptables/nftables layer.
